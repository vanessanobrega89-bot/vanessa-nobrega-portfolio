:root{--bg:#fff;--bg2:#f0f3fc;--ink:#0b0b0f;--ink2:#4c4f5c;--line:rgba(11,11,15,.12);--accent:#1f3fd1;--pad:clamp(20px,4.5vw,64px);--display:"Barlow Semi Condensed",sans-serif;--body:"Barlow",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:300 18px/1.7 var(--body);-webkit-font-smoothing:antialiased}
::selection{background:var(--accent);color:#fff}
a{color:inherit;text-underline-offset:.22em;text-decoration-thickness:1px}

.nav{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}

.back svg,.cta a svg{width:15px;height:15px}
.cat{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
h1{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(2.3rem,5vw,3.9rem);line-height:1;letter-spacing:-.005em;text-wrap:balance;margin-bottom:24px}
.meta{font-size:14.5px;color:var(--ink2)}
article.body{padding-bottom:40px}
article.body > p:first-child{font-size:1.2em;line-height:1.6;color:var(--ink)}
article.body p{margin:0 0 1.15em;text-wrap:pretty}
article.body h2{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(1.6rem,2.8vw,2.2rem);line-height:1.05;margin:2.2em 0 .7em;text-wrap:balance}
article.body h3{font-family:var(--display);font-weight:600;font-size:1.3rem;line-height:1.2;margin:1.6em 0 .5em}
article.body ul,article.body ol{margin:0 0 1.3em 1.2em}
article.body li{margin-bottom:.45em;padding-left:.2em}
article.body li::marker{color:var(--accent)}
article.body a{color:var(--accent)}
article.body strong{font-weight:500}
.author{margin:40px 0 0;padding-top:24px;border-top:1px solid var(--line);font-size:15.5px;color:var(--ink2)}
.sources{margin:28px 0 0;font-size:14px;color:var(--ink2)}
.sources h2{font-family:var(--body);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;margin-bottom:10px;color:var(--ink2)}
.sources ul{list-style:none;display:grid;gap:6px}
.sources a{color:var(--ink2)}
.cta{background:var(--accent);color:#fff;margin-top:clamp(56px,8vw,96px);padding:clamp(48px,7vw,88px) 0}
.cta h2{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(2rem,4.5vw,3.4rem);line-height:1;margin-bottom:18px}

footer{padding:28px 0 36px;font-size:14px;color:var(--ink2)}

@media (max-width:640px){.nav .links{gap:18px}.nav .links a:not(:last-child){display:none}body{font-size:17px}}

article.body h2 .n{display:block;font-family:var(--body);font-weight:500;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
article.body blockquote{margin:2em 0;padding:4px 0 4px 24px;border-left:1px solid var(--accent);font-family:var(--display);font-weight:600;font-size:clamp(1.4rem,2.4vw,1.8rem);line-height:1.2;color:var(--ink)}
